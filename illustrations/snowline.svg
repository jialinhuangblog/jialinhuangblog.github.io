<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false"><style>
  .hut-f, .hut-f2 { animation: hut-fall linear infinite; }
  .hut-f2 { animation-name: hut-fall2; }
  @keyframes hut-fall { 0% { transform: translate(0, -20px) } 50% { transform: translate(var(--hut-sway), 310px) } 100% { transform: translate(0, 640px) } }
  @keyframes hut-fall2 { 0% { transform: translate(0, -20px) } 50% { transform: translate(var(--hut-sway), 350px) } 100% { transform: translate(0, 720px) } }
  .hut-sway { transform-box: view-box; animation: hut-sway ease-in-out infinite alternate; }
  @keyframes hut-sway { from { transform: rotate(calc(var(--amp) * -1)) } to { transform: rotate(var(--amp)) } }
  @media (prefers-reduced-motion: reduce) { .hut-f, .hut-f2, .hut-sway { animation: none } }
</style>
